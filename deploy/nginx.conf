# Nginx 反向代理配置（生产级高并发优化）

upstream kaoshi_backend {
    server api:3000;
    keepalive 64;
}

# 限流配置
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=qr:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# proxy 通用参数
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # 静态文件（Nginx 直接返回，不经过 Node）
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        root /var/www/kaoshi/public;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # 根路径和前端路由回退到 index.html（SPA 支持）
    location / {
        root /var/www/kaoshi/public;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # 登录接口限流
    location /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://kaoshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # QR 接口限流
    location /api/auth/qr/ {
        limit_req zone=qr burst=30 nodelay;
        proxy_pass http://kaoshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket 连接（连接数限制 + 粘性会话）
    location /api/auth/qr/ws/ {
        limit_conn ws_conn 5;

        proxy_pass http://kaoshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 通用 API
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://kaoshi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
