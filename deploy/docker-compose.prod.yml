version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /var/www/kaoshi:/var/www/kaoshi:ro
    depends_on:
      - api
    networks:
      - kaoshi-net
    restart: unless-stopped

  api:
    image: ghcr.io/your-org/kaoshi:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=kaoshi
      - DB_USER=kaoshi
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=warn
      - WORKERS=4
    depends_on:
      - postgres
      - pgbouncer
      - redis
    networks:
      - kaoshi-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kaoshi
      - POSTGRES_USER=kaoshi
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - kaoshi-net
    restart: unless-stopped

  pgbouncer:
    image: pgbouncer/pgbouncer:1.22.1
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_DATABASE=kaoshi
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - RESERVE_POOL_SIZE=10
      - ADMIN_USERS=kaoshi
      - DATABASES_USER=kaoshi
      - DATABASES_PASSWORD=${DB_PASSWORD}
    networks:
      - kaoshi-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /data/redis:/data
    networks:
      - kaoshi-net
    restart: unless-stopped

networks:
  kaoshi-net:
    driver: bridge
