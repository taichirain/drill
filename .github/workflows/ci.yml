name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaoshi_test
          POSTGRES_USER: kaoshi
          POSTGRES_PASSWORD: kaoshi_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run db:migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kaoshi_test
          DB_USER: kaoshi
          DB_PASSWORD: kaoshi_password
          REDIS_HOST: localhost
      - run: npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kaoshi_test
          DB_USER: kaoshi
          DB_PASSWORD: kaoshi_password
          REDIS_HOST: localhost
          JWT_SECRET: test-secret-change-in-production

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaoshi_test
          POSTGRES_USER: kaoshi
          POSTGRES_PASSWORD: kaoshi_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run db:migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kaoshi_test
          DB_USER: kaoshi
          DB_PASSWORD: kaoshi_password
      - run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kaoshi_test
          DB_USER: kaoshi
          DB_PASSWORD: kaoshi_password
          REDIS_HOST: localhost
          JWT_SECRET: test-secret-change-in-production

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kaoshi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
