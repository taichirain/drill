version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/kaoshi:ro
    depends_on:
      - api
      - redis
    networks:
      - kaoshi-net

  api:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=kaoshi
      - DB_USER=kaoshi
      - DB_PASSWORD=kaoshi_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - pgbouncer
      - redis
    networks:
      - kaoshi-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kaoshi
      - POSTGRES_USER=kaoshi
      - POSTGRES_PASSWORD=kaoshi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/pg-init:/docker-entrypoint-initdb.d:ro
    networks:
      - kaoshi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaoshi -d kaoshi"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: pgbouncer/pgbouncer:1.22.1
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_DATABASE=kaoshi
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - ADMIN_USERS=kaoshi
      - DATABASES_USER=kaoshi
      - DATABASES_PASSWORD=kaoshi_password
    depends_on:
      - postgres
    networks:
      - kaoshi-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - kaoshi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Prometheus 监控（可选）
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   networks:
  #     - kaoshi-net

  # Grafana 可视化（可选）
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - kaoshi-net

volumes:
  postgres_data:
  redis_data:
  # prometheus_data:
  # grafana_data:

networks:
  kaoshi-net:
    driver: bridge
